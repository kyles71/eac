name: Create master draft after dev deployment

on:
  workflow_run:
    workflows: [Deploy dev branch]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  create-master-pr:
    name: Create or update draft master PR
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create or update the master draft
        env:
          DEPLOYED_AT: ${{ github.event.workflow_run.updated_at }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYMENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-notes.mjs create-master-pr
